# Local OpenSearch for ASTRA traces (Transaction Trace, Notes, Account Trace, Internal Notes report).
# Started and checked with `npm run up` / `npm run status` (see README.md), not by hand.
#
# Everything joins the ASTRA network nps_default, so MNG / WL-MNG reach OpenSearch at
# http://astra-opensearch:9200, exactly like they reach Redis at nps_redis.
# Host ports are bound to 127.0.0.1 only.
name: astra-local-opensearch

# Hard caps so these never spike the laptop: CPU and memory per container, and docker's own log files.
x-logging: &logging
  driver: json-file
  options: { max-size: "5m", max-file: "2" }

services:
  opensearch:
    # Built by `npm run up` from the official no-JDK OpenSearch + this computer's JDK (see opensearch/Dockerfile).
    # Settings are in opensearch/opensearch.yml. No TLS / login on this local, loopback-only node
    # (remote has both; the queries are the same).
    build:
      context: ./opensearch
      args:
        OPENSEARCH_VERSION: ${OPENSEARCH_VERSION:-2.19.6}
        CONFIG_HASH: ${CONFIG_HASH:-}
    image: astra-opensearch:${OPENSEARCH_VERSION:-2.19.6}-local
    container_name: astra-opensearch
    restart: unless-stopped
    environment:
      # Kept light, measured with the real trace data plus 19 MB email entries (README "Resources"):
      # - heap 512 MB: the data needs a few tens of MB; 512 MB stores and searches the 19 MB entries
      #   without tripping a memory breaker (384 MB tripped one on each; 256 MB crashed);
      # - TieredStopAtLevel=1: only the quick Java compiler, so less memory and half the idle CPU;
      # - -Xlog: no GC log files growing inside the container, only JVM warnings in Docker's capped log.
      - OPENSEARCH_JAVA_OPTS=-Xms${OPENSEARCH_HEAP:-512m} -Xmx${OPENSEARCH_HEAP:-512m} -XX:TieredStopAtLevel=1 -Xlog:disable -Xlog:all=warning:stderr
    cpus: ${OPENSEARCH_CPUS:-1.5}
    mem_limit: ${OPENSEARCH_MEM_LIMIT:-1g}
    logging: *logging
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - astra-opensearch-data:/usr/share/opensearch/data
    ports:
      - "127.0.0.1:${OPENSEARCH_PORT:-9200}:9200"
    networks:
      nps:
        aliases: [opensearch]

  dashboards:
    image: opensearchproject/opensearch-dashboards:${DASHBOARDS_VERSION:-2.19.7}
    container_name: astra-opensearch-dashboards
    restart: unless-stopped
    # Lighter: the image bundles 15 plugins (alerting, anomaly detection, ML, SQL workbench, reports,
    # security analytics, ...) that each need an OpenSearch plugin this node does not have. They are
    # removed before Dashboards starts (only when the container is created), so it uses about 70 MB less
    # memory. Everything used here is built in: Discover, dashboards, Vega / markdown / metric panels.
    # They are removed with the image's own plugin tool, by name (securityDashboards is left to the
    # image's start script, which removes it and fixes the config with it). $$ is a literal $ here.
    entrypoint:
      - bash
      - -c
      - >-
        for p in alertingDashboards anomalyDetectionDashboards assistantDashboards customImportMapDashboards
        flowFrameworkDashboards ganttChartDashboards indexManagementDashboards mlCommonsDashboards
        notificationsDashboards observabilityDashboards queryInsightsDashboards queryWorkbenchDashboards
        reportsDashboards searchRelevanceDashboards securityAnalyticsDashboards;
        do [ -d "plugins/$$p" ] && ./bin/opensearch-dashboards-plugin remove "$$p"; done;
        exec ./opensearch-dashboards-docker-entrypoint.sh opensearch-dashboards
    environment:
      - OPENSEARCH_HOSTS=["http://astra-opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
      - SERVER_NAME=astra-local-opensearch
      - NODE_OPTIONS=--max-old-space-size=512
      # lets the red "Clear all trace data" button (a Vega panel) open the shipper's confirmation page
      - VEGA_ENABLEEXTERNALURLS=true
    cpus: ${DASHBOARDS_CPUS:-1.0}
    mem_limit: ${DASHBOARDS_MEM_LIMIT:-1g}
    logging: *logging
    # "Does the Dashboards server answer?" (not "is OpenSearch green"), so the background check
    # (npm run ensure) repairs a hung Dashboards, without restarting it when OpenSearch has a bad moment.
    healthcheck:
      test: ["CMD-SHELL", "curl -s --max-time 10 http://127.0.0.1:5601/api/status | grep -q overall"]
      interval: 30s
      timeout: 15s
      start_period: 180s
      retries: 5
    ports:
      - "127.0.0.1:${DASHBOARDS_PORT:-5601}:5601"
    networks: [nps]
    depends_on:
      opensearch:
        condition: service_healthy

  shipper:
    build: ./shipper
    image: astra-log-shipper:local
    container_name: astra-log-shipper
    restart: unless-stopped
    cpus: ${SHIPPER_CPUS:-0.5}
    mem_limit: ${SHIPPER_MEM_LIMIT:-256m}
    logging: *logging
    environment:
      - NODE_OPTIONS=--max-old-space-size=192
      - POLL_MS=400
      - RETENTION_DAYS=${RETENTION_DAYS:-5}
      - DISK_MIN_FREE_GB=${DISK_MIN_FREE_GB:-2}
      - REDIS_HOST=${REDIS_HOST:-nps_redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB=${REDIS_DB:-0}
      - LOG_REDIS_KEY=${LOG_REDIS_KEY:-nps-logs}
      - OPENSEARCH_URL=http://astra-opensearch:9200
      - DASHBOARDS_PUBLIC_URL=http://127.0.0.1:${DASHBOARDS_PORT:-5601}
      # For the status-page lookup, which runs the product's own opensearch-query.js:
      - OPS_URL=http://astra-opensearch:9200
      - OPS_USERNAME=local
      - OPS_PASSWORD=local
      - NODE_PATH=/app/node_modules
      - ASTRA_MOUNT=/astra
    volumes:
      # Read-only: the product's query module and action files, from whatever branch is checked out.
      - ${ASTRA_REPO:?run it through npm run up, or set ASTRA_REPO in .env}/mng/app/api:/astra/mng/app/api:ro
      - ${ASTRA_REPO:?run it through npm run up, or set ASTRA_REPO in .env}/mng/extensions/server_connect/modules:/astra/mng/extensions/server_connect/modules:ro
      - ${ASTRA_REPO:?run it through npm run up, or set ASTRA_REPO in .env}/wl-mng/app/api:/astra/wl-mng/app/api:ro
      - ${ASTRA_REPO:?run it through npm run up, or set ASTRA_REPO in .env}/wl-mng/extensions/server_connect/modules:/astra/wl-mng/extensions/server_connect/modules:ro
    ports:
      - "127.0.0.1:${SHIPPER_PORT:-9700}:9700"
    networks: [nps]
    depends_on:
      opensearch:
        condition: service_healthy

networks:
  nps:
    external: true
    name: nps_default

volumes:
  astra-opensearch-data:
    name: astra-opensearch-data
